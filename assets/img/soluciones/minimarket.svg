    <circle cx="370" cy="332" r="12" fill="#0b1324" stroke="#4ade80" stroke-width="6"/>
    <circle cx="466" cy="332" r="12" fill="#0b1324" stroke="#4ade80" stroke-width="6"/>
  </g>

  <rect y="410" width="800" height="40" fill="#05080f"/>

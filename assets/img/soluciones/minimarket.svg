<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Almacén / minimarket: estanterías con productos y carro de compras -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c2c"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <symbol id="bottle" viewBox="0 0 26 70">
      <path d="M9 0h8v12q9 6 9 16v38q0 4-4 4H4q-4 0-4-4V28q0-10 9-16z" fill="currentColor"/>
      <rect x="0" y="36" width="26" height="16" fill="#fff" opacity=".35"/>
      <rect x="4" y="18" width="4" height="44" rx="2" fill="#fff" opacity=".25"/>
    </symbol>
    <symbol id="can" viewBox="0 0 30 44">
      <rect width="30" height="44" rx="5" fill="currentColor"/>
      <rect y="0" width="30" height="7" rx="3" fill="#e2e8f0" opacity=".7"/>
      <rect y="18" width="30" height="10" fill="#fff" opacity=".3"/>
    </symbol>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="70" y="24" width="660" height="410" rx="14" fill="#0c1424" stroke="#4ade80" stroke-opacity=".2"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- Fila 1: cajas -->
  <g>
    <rect x="96" y="58" width="44" height="52" rx="4" fill="#4ade80"/>
    <rect x="146" y="46" width="40" height="64" rx="4" fill="#fbbf24"/>
    <rect x="192" y="62" width="50" height="48" rx="4" fill="#f87171"/>
    <rect x="248" y="50" width="38" height="60" rx="4" fill="#60a5fa"/>
    <rect x="292" y="58" width="46" height="52" rx="4" fill="#e2e8f0"/>
    <rect x="344" y="44" width="40" height="66" rx="4" fill="#4ade80"/>
    <rect x="390" y="60" width="52" height="50" rx="4" fill="#a78bfa"/>
    <rect x="448" y="52" width="40" height="58" rx="4" fill="#fbbf24"/>
    <rect x="494" y="62" width="46" height="48" rx="4" fill="#22d3ee"/>
    <rect x="546" y="46" width="40" height="64" rx="4" fill="#f472b6"/>
    <rect x="592" y="58" width="50" height="52" rx="4" fill="#4ade80"/>
    <rect x="648" y="50" width="54" height="60" rx="4" fill="#60a5fa"/>
    <g fill="#fff" opacity=".3">
      <rect x="96" y="78" width="44" height="12"/>
      <rect x="146" y="72" width="40" height="12"/>
      <rect x="192" y="80" width="50" height="12"/>
      <rect x="248" y="74" width="38" height="12"/>
      <rect x="292" y="78" width="46" height="12"/>
      <rect x="344" y="70" width="40" height="12"/>
      <rect x="390" y="79" width="52" height="12"/>
      <rect x="448" y="75" width="40" height="12"/>
      <rect x="494" y="80" width="46" height="12"/>
      <rect x="546" y="72" width="40" height="12"/>
      <rect x="592" y="78" width="50" height="12"/>
      <rect x="648" y="74" width="54" height="12"/>
    </g>
  </g>
  <rect x="86" y="110" width="628" height="8" rx="4" fill="#4ade80" opacity=".85"/>


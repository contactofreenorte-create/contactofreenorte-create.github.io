    <use href="#bottle" x="134" y="125" width="26" height="70" color="#f87171"/>
    <use href="#bottle" x="168" y="125" width="26" height="70" color="#fbbf24"/>
    <use href="#bottle" x="202" y="125" width="26" height="70" color="#4ade80"/>
    <use href="#bottle" x="236" y="125" width="26" height="70" color="#22d3ee"/>
    <use href="#bottle" x="270" y="125" width="26" height="70" color="#a78bfa"/>
    <use href="#bottle" x="304" y="125" width="26" height="70" color="#f87171"/>
    <use href="#bottle" x="338" y="125" width="26" height="70" color="#fbbf24"/>
    <use href="#bottle" x="372" y="125" width="26" height="70" color="#60a5fa"/>
    <use href="#bottle" x="406" y="125" width="26" height="70" color="#4ade80"/>
    <use href="#bottle" x="440" y="125" width="26" height="70" color="#f472b6"/>
    <use href="#bottle" x="474" y="125" width="26" height="70" color="#22d3ee"/>
    <use href="#bottle" x="508" y="125" width="26" height="70" color="#fbbf24"/>
    <use href="#bottle" x="542" y="125" width="26" height="70" color="#f87171"/>
    <use href="#bottle" x="576" y="125" width="26" height="70" color="#a78bfa"/>
    <use href="#bottle" x="610" y="125" width="26" height="70" color="#4ade80"/>
    <use href="#bottle" x="644" y="125" width="26" height="70" color="#60a5fa"/>
    <use href="#bottle" x="678" y="125" width="26" height="70" color="#22d3ee"/>
  </g>
  <rect x="86" y="195" width="628" height="8" rx="4" fill="#4ade80" opacity=".85"/>

  <!-- Fila 3: latas -->

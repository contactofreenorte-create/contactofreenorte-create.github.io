  <rect x="86" y="280" width="628" height="8" rx="4" fill="#4ade80" opacity=".85"/>

  <!-- Carro de compras -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="355" y="205" width="34" height="30" rx="4" fill="#fbbf24"/>
    <rect x="394" y="196" width="30" height="40" rx="4" fill="#f87171"/>
    <use href="#bottle" x="430" y="182" width="22" height="58" color="#22d3ee"/>
    <rect x="456" y="208" width="30" height="28" rx="4" fill="#a78bfa"/>
    <path d="M330 225H500L480 300H350Z" fill="#0b1324" fill-opacity=".88"/>
    <g stroke="#4ade80" stroke-width="10" fill="none" opacity=".45" filter="url(#blur)">
      <path d="M292 205H318L330 225H500L480 300H350L330 225"/>

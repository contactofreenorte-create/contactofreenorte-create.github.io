    <use href="#can" x="100" y="236" width="30" height="44" color="#f87171"/>
    <use href="#can" x="136" y="236" width="30" height="44" color="#f87171"/>
    <use href="#can" x="172" y="236" width="30" height="44" color="#fbbf24"/>
    <use href="#can" x="208" y="236" width="30" height="44" color="#fbbf24"/>
    <use href="#can" x="244" y="236" width="30" height="44" color="#4ade80"/>
    <use href="#can" x="280" y="236" width="30" height="44" color="#4ade80"/>
    <use href="#can" x="316" y="236" width="30" height="44" color="#60a5fa"/>
    <use href="#can" x="352" y="236" width="30" height="44" color="#60a5fa"/>
    <use href="#can" x="388" y="236" width="30" height="44" color="#a78bfa"/>
    <use href="#can" x="424" y="236" width="30" height="44" color="#a78bfa"/>
    <use href="#can" x="460" y="236" width="30" height="44" color="#22d3ee"/>
    <use href="#can" x="496" y="236" width="30" height="44" color="#22d3ee"/>
    <use href="#can" x="532" y="236" width="30" height="44" color="#f472b6"/>
    <use href="#can" x="568" y="236" width="30" height="44" color="#f472b6"/>
    <use href="#can" x="604" y="236" width="30" height="44" color="#fbbf24"/>
